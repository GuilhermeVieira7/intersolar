    :root {

      --color-graphite: #151817;
      --color-graphite-light: #202422;
      --color-warm-white: #f4f2ea;

    .grid-overlay {

      padding: 0 var(--gutter); opacity: 0.04;

      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- CURSOR COMPONENT ---
    const Cursor = ({ cursorState }) => {
      const [pos, setPos] = useState({ x: -100, y: -100 });
      const [isTouchDevice, setIsTouchDevice] = useState(false);

      useEffect(() => {
        setIsTouchDevice('ontouchstart' in window || navigator.maxTouchPoints > 0);
        const handleMouseMove = (e) => setPos({ x: e.clientX, y: e.clientY });
        window.addEventListener('mousemove', handleMouseMove);
        return () => window.removeEventListener('mousemove', handleMouseMove);
      }, []);

      if (isTouchDevice) return null;
      const isHovered = Boolean(cursorState?.text);

      return (
        <div className={`custom-cursor ${isHovered ? 'hovered' : ''}`} style={{ left: `${pos.x}px`, top: `${pos.y}px` }}>
          {isHovered && <span className="custom-cursor-text">{cursorState.text}</span>}
        </div>
      );
    };

    // --- SOLAR SYSTEM CANVAS ENGINE ---
    const SolarSystem = ({ isExpanding, tweaks }) => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = (canvas.width = canvas.parentElement.clientWidth);
        let height = (canvas.height = canvas.parentElement.clientHeight);

        const handleResize = () => {
          if (!canvas.parentElement) return;
          width = canvas.width = canvas.parentElement.clientWidth;
          height = canvas.height = canvas.parentElement.clientHeight;
        };
        window.addEventListener('resize', handleResize);

        const mouse = { x: width / 2, y: height / 2, targetX: width / 2, targetY: height / 2 };
        const handleMouseMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          mouse.targetX = e.clientX - rect.left;
          mouse.targetY = e.clientY - rect.top;
        };
        window.addEventListener('mousemove', handleMouseMove);

        const numParticles = tweaks?.particles === false ? 0 : (tweaks?.motion === 'low' ? 60 : tweaks?.motion === 'high' ? 220 : 130);
        const particles = [];

        for (let i = 0; i < numParticles; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = 80 + Math.random() * (Math.min(width, height) * 0.35);
          particles.push({
            x: width / 2 + Math.cos(angle) * dist,
            y: height / 2 + Math.sin(angle) * dist,
            baseAngle: angle,
            baseDist: dist,
            size: Math.random() * 2.2 + 0.6,
            speed: (Math.random() * 0.008 + 0.002) * (tweaks?.motion === 'low' ? 0.5 : tweaks?.motion === 'high' ? 1.8 : 1),
            opacity: Math.random() * 0.7 + 0.3
          });
        }

        let expansionFactor = 1;
        let shockwaveRadius = 0;

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          mouse.x += (mouse.targetX - mouse.x) * 0.05;
          mouse.y += (mouse.targetY - mouse.y) * 0.05;

          const centerX = width / 2;
          const centerY = height / 2;

          if (isExpanding) {
            expansionFactor += 0.08;
            shockwaveRadius += 35;
          } else {
            expansionFactor += (1 - expansionFactor) * 0.05;
            shockwaveRadius = 0;
          }

          const sunRadius = Math.min(width, height) * 0.16 * expansionFactor;

          // Rings
          ctx.save();
          ctx.translate(centerX, centerY);
          for (let r = 1; r <= 3; r++) {
            ctx.beginPath();
            ctx.arc(0, 0, sunRadius * (1.6 + r * 0.45), 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 196, 0, ${0.12 / r})`;
            ctx.setLineDash([8 + r * 4, 12 + r * 6]);
            ctx.rotate((Date.now() * 0.0002) * (r % 2 === 0 ? 1 : -1));
            ctx.stroke();
          }
          ctx.restore();

          // Glow
          if (tweaks?.glow !== false) {
            const glowGrad = ctx.createRadialGradient(
              centerX + (mouse.x - centerX) * 0.08, centerY + (mouse.y - centerY) * 0.08, sunRadius * 0.2,
              centerX, centerY, sunRadius * 2.8
            );
            glowGrad.addColorStop(0, 'rgba(255, 220, 100, 0.9)');
            glowGrad.addColorStop(0.25, 'rgba(255, 196, 0, 0.45)');
            glowGrad.addColorStop(0.65, 'rgba(255, 122, 0, 0.18)');
            glowGrad.addColorStop(1, 'rgba(11, 13, 12, 0)');
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(centerX, centerY, sunRadius * 2.8, 0, Math.PI * 2);
            ctx.fill();
          }

          // Core
          const computedAccent = (getComputedStyle(document.documentElement).getPropertyValue('--accent-color') || '#FFC400').trim();
          const coreGrad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, sunRadius);
          coreGrad.addColorStop(0, '#FFFFFF');
          coreGrad.addColorStop(0.3, computedAccent || '#FFC400');
          coreGrad.addColorStop(0.8, '#FF7A00');
          coreGrad.addColorStop(1, 'rgba(255, 122, 0, 0)');
          ctx.fillStyle = coreGrad;
          ctx.beginPath();
          ctx.arc(centerX, centerY, sunRadius, 0, Math.PI * 2);
          ctx.fill();

          // Particles
          particles.forEach((p) => {
            p.baseAngle += p.speed;
            const dx = mouse.x - (centerX + Math.cos(p.baseAngle) * p.baseDist);
            const dy = mouse.y - (centerY + Math.sin(p.baseAngle) * p.baseDist);
            const distToMouse = Math.sqrt(dx * dx + dy * dy);
            const mouseFactor = distToMouse < 180 ? (1 - distToMouse / 180) * 25 : 0;

            const currentDist = p.baseDist * expansionFactor + mouseFactor;
            const pX = centerX + Math.cos(p.baseAngle) * currentDist;
            const pY = centerY + Math.sin(p.baseAngle) * currentDist;

            ctx.beginPath();
            ctx.arc(pX, pY, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 220, 140, ${p.opacity})`;
            ctx.fill();
          });

          if (isExpanding && shockwaveRadius > 0) {
            ctx.beginPath();
            ctx.arc(centerX, centerY, shockwaveRadius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 196, 0, 0.7)';
            ctx.lineWidth = 3;
            ctx.stroke();
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();
        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
        };
      }, [isExpanding, tweaks]);

      return <canvas ref={canvasRef} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none', zIndex: 1 }} />;
    };

    // --- HERO ---
    const Hero = ({ setCursorState, onExploreClick, isExpanding, tweaks }) => (
      <section className="hero-section" id="hero">
        <div className="hero-canvas-container">
          <SolarSystem isExpanding={isExpanding} tweaks={tweaks} />
        </div>
        <div className="hero-content container">
          <div className="hero-badge-wrap">
            <span className="mono-tag">INTERSOLAR</span>
            <span className="hero-badge-divider">/</span>
            <span className="hero-badge-sub">ENERGIA SOLAR · PARAUAPEBAS</span>
          </div>
          <h1 className="hero-heading">
            A energia começa no <span className="solar-word">sol.</span><br />
            <span className="engineering-word">O resto é engenharia.</span>
          </h1>
          <p className="hero-subtext">
            Projeto, instalação e homologação completa para transformar o potencial solar do seu imóvel em energia.
          </p>
          <div className="hero-cta-group">
            <a href="https://wa.me/5594999999999" target="_blank" rel="noopener noreferrer" className="btn-primary" onMouseEnter={() => setCursorState({ text: 'WHATSAPP' })} onMouseLeave={() => setCursorState({ text: null })}>
              <span>SOLICITAR ORÇAMENTO</span><span className="arrow">→</span>
            </a>
            <button type="button" className="btn-secondary" onClick={onExploreClick} onMouseEnter={() => setCursorState({ text: 'EXPLORAR' })} onMouseLeave={() => setCursorState({ text: null })}>
              <span>EXPLORAR A EXPERIÊNCIA</span><span>↓</span>
            </button>
          </div>
        </div>
        <div className="hero-footer container">
          <div><span className="mono-label">LOCALIZAÇÃO</span><br /><span className="hero-footer-val">PARAUAPEBAS + REGIÃO</span></div>
          <div className="hero-scroll-prompt" onClick={onExploreClick}><span>SCROLL TO DISCOVER</span><div className="scroll-bar-line"></div></div>
        </div>
        <style>{`
          .hero-section { position: relative; width: 100%; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding-top: calc(var(--header-height) + 2rem); padding-bottom: 2rem; overflow: hidden; background: radial-gradient(circle at 50% 50%, rgba(21, 24, 23, 0.4) 0%, var(--color-solar-black) 90%); }
          .hero-canvas-container { position: absolute; inset: 0; z-index: 1; }
          .hero-content { position: relative; z-index: 10; max-width: 1100px; margin-top: auto; margin-bottom: auto; padding-top: 3rem; }
          .hero-badge-wrap { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.75rem; }
          .hero-badge-divider { color: var(--color-border-dark); font-family: var(--font-mono); }
          .hero-badge-sub { font-family: var(--font-mono); font-size: 0.75rem; color: var(--color-muted-grey); letter-spacing: 0.1em; }
          .hero-subtext { font-size: clamp(1.1rem, 2vw, 1.5rem); color: rgba(244, 242, 234, 0.82); max-width: 680px; font-weight: 300; line-height: 1.5; margin-bottom: 2.75rem; }
          .hero-cta-group { display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap; }
          .hero-footer { position: relative; z-index: 10; display: flex; align-items: flex-end; justify-content: space-between; border-top: 1px solid rgba(244, 242, 234, 0.08); padding-top: 1.5rem; margin-top: 2rem; }
          .mono-label { font-family: var(--font-mono); font-size: 0.65rem; color: var(--color-muted-grey); letter-spacing: 0.15em; }
          .hero-footer-val { font-family: var(--font-mono); font-size: 0.85rem; font-weight: 600; color: var(--color-warm-white); }
          .hero-scroll-prompt { display: flex; align-items: center; gap: 1rem; font-family: var(--font-mono); font-size: 0.75rem; color: var(--color-muted-grey); letter-spacing: 0.12em; cursor: pointer; }
          .scroll-bar-line { width: 40px; height: 1px; background-color: var(--color-muted-grey); position: relative; overflow: hidden; }
          .scroll-bar-line::after { content: ''; position: absolute; left: 0; top: 0; width: 50%; height: 100%; background-color: var(--accent-color); animation: slideScrollLine 2s infinite cubic-bezier(0.65, 0, 0.35, 1); }
          @keyframes slideScrollLine { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }
        `}</style>
      </section>
    );

    // --- ENERGY FLOW ---
    const EnergyFlow = ({ setCursorState }) => {
      const [activeStep, setActiveStep] = useState(1);
      const canvasRef = useRef(null);

      const steps = [
        { id: 0, label: 'SOL', sub: 'RADIAÇÃO', verb: 'ORIGEM', desc: 'Emissão contínua de fótons de alta densidade energética.' },
        { id: 1, label: 'PAINÉIS', sub: 'CAPTAÇÃO', verb: 'CAPTAÇÃO', desc: 'Transformação de fótons em corrente contínua (CC) através de células fotovoltaicas.' },
        { id: 2, label: 'INVERSOR', sub: 'CONVERSÃO', verb: 'CONVERSÃO', desc: 'Conversão inteligente de corrente contínua em corrente alternada (CA) trifásica/monofásica.' },
        { id: 3, label: 'IMÓVEL', sub: 'UTILIZAÇÃO', verb: 'ENERGIA', desc: 'Abastecimento imediato da infraestrutura elétrica residencial ou comercial.' },
        { id: 4, label: 'CONSUMO', sub: 'EFICIÊNCIA', verb: 'SEU IMÓVEL', desc: 'Autonomia real com injeção do excedente na rede da concessionária local.' }
      ];

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let w = (canvas.width = canvas.parentElement.clientWidth);

          ctx.beginPath(); ctx.moveTo(margin, nodeY); ctx.lineTo(activeX, nodeY);
          ctx.strokeStyle = computedAccent || '#FFC400'; ctx.lineWidth = 3; ctx.stroke();

          animationFrameId = requestAnimationFrame(render);
        };
        render();
        return () => cancelAnimationFrame(animationFrameId);
