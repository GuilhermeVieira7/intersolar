<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;700&family=Inter+Tight:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --color-offwhite: #F7F6F1;
      --color-offwhite-card: #EFECE4;
      --color-dark-bg: #0B0D0C;
      --color-dark-card: #151817;
      --color-black-text: #080908;
      --color-solar-yellow: #FFC400;
      --color-solar-orange: #FF7A00;
      --color-tech-green: #16452E;
      --color-grey-muted: #8C908B;
      --color-border-light: rgba(8, 9, 8, 0.12);
      --color-border-dark: rgba(247, 246, 241, 0.12);
      --color-glow-yellow: rgba(255, 196, 0, 0.35);

      --accent-color: var(--color-solar-yellow);
      --accent-glow: var(--color-glow-yellow);

      --font-display: 'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Geist Mono', monospace;

      --gutter: clamp(1rem, 4vw, 4rem);
      --max-width: 1440px;
      --header-height: 72px;

      --transition-fast: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      --transition-smooth: 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      background-color: var(--color-offwhite);
      color: var(--color-black-text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body { width: 100%; min-height: 100vh; background-color: var(--color-offwhite); overflow-x: hidden; }

    ::selection { background-color: var(--accent-color); color: var(--color-dark-bg); }

    h1, h2, h3, h4, h5, h6 { font-family: var(--font-display); font-weight: 800; line-height: 0.95; letter-spacing: -0.03em; text-wrap: balance; }
    p { text-wrap: pretty; }

    .mono-tag {
      font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 0.15em; color: var(--color-tech-green); display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 700;
    }
    .mono-tag::before { content: ''; display: inline-block; width: 6px; height: 6px; background-color: var(--color-tech-green); border-radius: 50%; }

    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.85rem; background-color: var(--accent-color); color: var(--color-dark-bg);
      font-family: var(--font-display); font-weight: 800; font-size: 0.95rem; letter-spacing: 0.05em; padding: 1.15rem 2.25rem;
      border-radius: 9999px; border: 1px solid var(--accent-color); cursor: pointer; text-decoration: none;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast), background-color var(--transition-fast);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 25px var(--accent-glow); background-color: #FFFFFF; }

    .btn-secondary {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.75rem; background: transparent; color: var(--color-black-text);
      font-family: var(--font-display); font-weight: 700; font-size: 0.9rem; letter-spacing: 0.05em; padding: 1.15rem 2rem;
      border-radius: 9999px; border: 1px solid var(--color-border-light); cursor: pointer; text-decoration: none;
      transition: border-color var(--transition-fast), color var(--transition-fast);
    }
    .btn-secondary:hover { border-color: var(--color-tech-green); color: var(--color-tech-green); }

    .container { width: 100%; max-width: var(--max-width); margin: 0 auto; padding: 0 var(--gutter); }
    .section { position: relative; padding: clamp(3.5rem, 7vw, 7.5rem) 0; }
    .section-light-theme { background-color: var(--color-offwhite); color: var(--color-black-text); }
    .section-dark-theme { background-color: var(--color-dark-bg); color: var(--color-offwhite); }
    .section-dark-theme .mono-tag { color: var(--accent-color); }
    .section-dark-theme .mono-tag::before { background-color: var(--accent-color); }

    .glass-card { background: rgba(21, 24, 23, 0.6); border: 1px solid var(--color-border-dark); border-radius: 20px; padding: clamp(1.25rem, 3vw, 3rem); backdrop-filter: blur(10px); }

    .custom-cursor {
      position: fixed; top: 0; left: 0; width: 12px; height: 12px; background-color: var(--accent-color); border-radius: 50%;
      pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: transform 0.1s ease-out, width 0.3s ease, height 0.3s ease;
      box-shadow: 0 0 15px var(--accent-glow);
    }
    .custom-cursor.hovered { width: 48px; height: 48px; background-color: rgba(255, 196, 0, 0.2); border: 1px solid var(--accent-color); backdrop-filter: blur(4px); }
    .custom-cursor-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: var(--font-mono); font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; color: var(--color-offwhite); text-transform: uppercase; }

    .tweaks-panel { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9000; background: rgba(21, 24, 23, 0.92); border: 1px solid var(--color-border-dark); backdrop-filter: blur(16px); border-radius: 16px; padding: 1.25rem; box-shadow: 0 20px 40px rgba(0,0,0,0.6); width: 280px; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .tweaks-panel.minimized { transform: translateY(calc(100% - 44px)); }
    .tweaks-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; cursor: pointer; }
    .tweaks-title { font-family: var(--font-mono); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; color: var(--accent-color); display: flex; align-items: center; gap: 0.5rem; }
    .tweaks-label { font-family: var(--font-mono); font-size: 0.65rem; color: var(--color-grey-muted); text-transform: uppercase; margin-bottom: 0.35rem; display: block; }
    .tweaks-options { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .tweaks-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--color-offwhite); font-family: var(--font-mono); font-size: 0.65rem; padding: 0.25rem 0.6rem; border-radius: 4px; cursor: pointer; transition: all 0.2s ease; }
    .tweaks-btn:hover, .tweaks-btn.active { background: var(--accent-color); color: var(--color-dark-bg); border-color: var(--accent-color); }

    input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 4px; background: rgba(8, 9, 8, 0.12); outline: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-color); border: 3px solid var(--color-dark-bg); cursor: pointer; box-shadow: 0 0 15px var(--accent-glow); }

    .mobile-only { display: none; }

    @media (max-width: 900px) {
      :root { --header-height: 64px; }
      .btn-primary, .btn-secondary { width: 100% !important; justify-content: center !important; }
      .custom-cursor { display: none !important; }
      .tweaks-panel { bottom: 0.75rem; right: 0.75rem; width: calc(100vw - 1.5rem); }
      .desktop-only { display: none !important; }
      .mobile-only { display: flex !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- CURSOR ---
    const Cursor = ({ cursorState }) => {
      const [pos, setPos] = useState({ x: -100, y: -100 });
      const [isTouch, setIsTouch] = useState(false);

      useEffect(() => {
        setIsTouch('ontouchstart' in window || navigator.maxTouchPoints > 0);
        const handleMouseMove = (e) => setPos({ x: e.clientX, y: e.clientY });
        window.addEventListener('mousemove', handleMouseMove);
        return () => window.removeEventListener('mousemove', handleMouseMove);
      }, []);

      if (isTouch) return null;
      const isHovered = Boolean(cursorState?.text);

      return (
        <div className={`custom-cursor ${isHovered ? 'hovered' : ''}`} style={{ left: `${pos.x}px`, top: `${pos.y}px` }}>
          {isHovered && <span className="custom-cursor-text">{cursorState.text}</span>}
        </div>
      );
    };

    // --- NAV ---
    const Nav = ({ setCursorState }) => {
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      return (
        <header style={{ position: 'fixed', top: 0, left: 0, width: '100%', height: 'var(--header-height)', zIndex: 1000, background: 'rgba(247, 246, 241, 0.95)', backdropFilter: 'blur(16px)', borderBottom: '1px solid rgba(8, 9, 8, 0.08)', display: 'flex', alignItems: 'center' }}>
          <div className="container" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', width: '100%' }}>
            <a href="#hero-comercial" style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', textDecoration: 'none', color: 'var(--color-black-text)' }}>
              <div style={{ width: '34px', height: '34px', borderRadius: '50%', background: 'radial-gradient(circle at 35% 35%, var(--accent-color), var(--color-solar-orange))', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>☀️</div>
              <div>
                <span style={{ fontFamily: 'var(--font-display)', fontWeight: 900, fontSize: '1.2rem', display: 'block' }}>INTERSOLAR</span>
                <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.6rem', color: 'var(--color-tech-green)', fontWeight: 700 }}>PARAUAPEBAS + REGIÃO</span>
              </div>
            </a>

            <nav className="desktop-only" style={{ display: 'flex', gap: '1.5rem', alignItems: 'center' }}>
              <a href="#simulador" style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: '0.85rem', color: 'var(--color-black-text)', textDecoration: 'none' }}>SIMULADOR</a>
              <a href="#como-funciona" style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: '0.85rem', color: 'var(--color-black-text)', textDecoration: 'none' }}>PROCESSO</a>
              <a href="#servicos" style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: '0.85rem', color: 'var(--color-black-text)', textDecoration: 'none' }}>SERVIÇOS</a>
              <a href="#projetos" style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: '0.85rem', color: 'var(--color-black-text)', textDecoration: 'none' }}>PROJETOS</a>
              <a href="#faq" style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: '0.85rem', color: 'var(--color-black-text)', textDecoration: 'none' }}>FAQ</a>
              <a href="/imersivo" style={{ fontFamily: 'var(--font-mono)', fontSize: '0.7rem', fontWeight: 700, color: 'var(--accent-color)', background: 'var(--color-dark-bg)', padding: '0.4rem 0.8rem', borderRadius: '99px', textDecoration: 'none' }}>✨ EXPERIÊNCIA IMERSIVA</a>
            </nav>

            <a href="https://wa.me/5594999999999" target="_blank" rel="noopener noreferrer" className="btn-primary desktop-only" style={{ padding: '0.65rem 1.4rem', fontSize: '0.8rem' }}>
              <span>ORÇAMENTO</span><span>→</span>
            </a>

            <button type="button" className="mobile-only" onClick={() => setMobileMenuOpen(!mobileMenuOpen)} style={{ background: 'var(--color-dark-bg)', color: 'var(--accent-color)', border: 'none', fontSize: '1.5rem', width: '42px', height: '42px', borderRadius: '50%', cursor: 'pointer', alignItems: 'center', justifyContent: 'center' }}>
              {mobileMenuOpen ? '✕' : '☰'}
            </button>
          </div>

          {mobileMenuOpen && (
            <div style={{ position: 'fixed', top: 'var(--header-height)', left: 0, width: '100vw', height: 'calc(100vh - var(--header-height))', background: 'rgba(11, 13, 12, 0.98)', backdropFilter: 'blur(20px)', zIndex: 999, padding: '2.5rem 1.5rem', display: 'flex', flexDirection: 'column' }}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
                <a href="#simulador" onClick={() => setMobileMenuOpen(false)} style={{ fontFamily: 'var(--font-display)', fontSize: '1.5rem', fontWeight: 800, color: 'var(--color-offwhite)', textDecoration: 'none', borderBottom: '1px solid rgba(247, 246, 241, 0.1)', paddingBottom: '0.75rem' }}>SIMULADOR</a>
                <a href="#como-funciona" onClick={() => setMobileMenuOpen(false)} style={{ fontFamily: 'var(--font-display)', fontSize: '1.5rem', fontWeight: 800, color: 'var(--color-offwhite)', textDecoration: 'none', borderBottom: '1px solid rgba(247, 246, 241, 0.1)', paddingBottom: '0.75rem' }}>PROCESSO</a>
                <a href="#servicos" onClick={() => setMobileMenuOpen(false)} style={{ fontFamily: 'var(--font-display)', fontSize: '1.5rem', fontWeight: 800, color: 'var(--color-offwhite)', textDecoration: 'none', borderBottom: '1px solid rgba(247, 246, 241, 0.1)', paddingBottom: '0.75rem' }}>SERVIÇOS</a>
                <a href="#projetos" onClick={() => setMobileMenuOpen(false)} style={{ fontFamily: 'var(--font-display)', fontSize: '1.5rem', fontWeight: 800, color: 'var(--color-offwhite)', textDecoration: 'none', borderBottom: '1px solid rgba(247, 246, 241, 0.1)', paddingBottom: '0.75rem' }}>PROJETOS</a>
                <a href="#faq" onClick={() => setMobileMenuOpen(false)} style={{ fontFamily: 'var(--font-display)', fontSize: '1.5rem', fontWeight: 800, color: 'var(--color-offwhite)', textDecoration: 'none', borderBottom: '1px solid rgba(247, 246, 241, 0.1)', paddingBottom: '0.75rem' }}>FAQ</a>
                <a href="/imersivo" onClick={() => setMobileMenuOpen(false)} style={{ fontFamily: 'var(--font-mono)', fontSize: '1.1rem', fontWeight: 700, color: 'var(--accent-color)', textDecoration: 'none' }}>✨ EXPERIÊNCIA IMERSIVA</a>
                <a href="https://wa.me/5594999999999" target="_blank" rel="noopener noreferrer" className="btn-primary" style={{ marginTop: '1.5rem', justifyContent: 'center' }}>
                  <span>SOLICITAR ORÇAMENTO →</span>
                </a>
              </div>
            </div>
          )}
        </header>
      );
    };

    // --- HERO COMERCIAL ---
    const HeroComercial = ({ setCursorState, onCalculateClick }) => (
      <section className="section section-light-theme" id="hero-comercial" style={{ paddingTop: 'calc(var(--header-height) + 3rem)', paddingBottom: 0 }}>
        <div className="container" style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '3rem', alignItems: 'center', marginBottom: '4rem' }}>
          <div>
            <span className="mono-tag" style={{ marginBottom: '1.5rem' }}>ENERGIA SOLAR · PARAUAPEBAS + REGIÃO</span>
            <h1 style={{ fontSize: 'clamp(2.5rem, 6vw, 6rem)', lineHeight: 0.92, marginBottom: '1.5rem' }}>Sua energia pode trabalhar a seu favor.</h1>
            <p style={{ fontSize: '1.25rem', color: 'var(--color-grey-muted)', lineHeight: 1.6, maxWidth: '580px', marginBottom: '2.75rem' }}>
              Projeto, instalação e homologação completa para transformar o potencial solar do seu imóvel em geração própria.
            </p>
            <div style={{ display: 'flex', gap: '1.25rem', flexWrap: 'wrap' }}>
              <button type="button" className="btn-primary" onClick={onCalculateClick} onMouseEnter={() => setCursorState({ text: 'SIMULAR' })} onMouseLeave={() => setCursorState({ text: null })}>
                <span>CALCULAR MEU POTENCIAL</span><span>→</span>
              </button>
              <a href="https://wa.me/5594999999999" target="_blank" rel="noopener noreferrer" className="btn-secondary" onMouseEnter={() => setCursorState({ text: 'ATENDIMENTO' })} onMouseLeave={() => setCursorState({ text: null })}>
                <span>FALAR COM ESPECIALISTA</span>
              </a>
            </div>
          </div>
          <div style={{ background: '#EFECE3', border: '1px solid var(--color-border-light)', borderRadius: '28px', padding: '2rem 1.5rem', minHeight: '320px', display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '1rem' }}>
            {['SOL ☀', 'PAINÉIS 🔲', 'INVERSOR ⚡', 'IMÓVEL 🏠'].map((n) => (
              <div key={n} style={{ textAlign: 'center', background: '#FFFFFF', padding: '1rem', borderRadius: '16px', border: '1px solid rgba(8,9,8,0.1)', fontFamily: 'var(--font-mono)', fontSize: '0.85rem', fontWeight: 700 }}>
                {n}
              </div>
            ))}
          </div>
        </div>

        <div style={{ background: 'var(--color-dark-bg)', color: 'var(--color-offwhite)', padding: '1rem 0', overflow: 'hidden', whiteSpace: 'nowrap' }}>
          <div style={{ display: 'inline-flex', gap: '2rem', fontFamily: 'var(--font-mono)', fontSize: '0.8rem', fontWeight: 700, letterSpacing: '0.1em' }}>
            <span>INTERSOLAR • ENERGIA SOLAR • PARAUAPEBAS + REGIÃO • PROJETO • INSTALAÇÃO • HOMOLOGAÇÃO COMPLETA</span>
          </div>
        </div>
      </section>
    );

    // --- SIMULATOR ---
    const Simulator = ({ setCursorState }) => {
      const [monthlySpend, setMonthlySpend] = useState(850);
      const [propertyType, setPropertyType] = useState('RESIDENCIAL');

      const mult = propertyType === 'RESIDENCIAL' ? 0.90 : propertyType === 'COMERCIAL' ? 0.92 : 0.94;
      const estimatedMonthlySavings = Math.round(monthlySpend * mult);
      const estimatedAnnualSavings = estimatedMonthlySavings * 12;
      const estimatedKwp = (monthlySpend / 140).toFixed(1);

      return (
        <section className="section section-light-theme" id="simulador">
          <div className="container">
            <div style={{ textAlign: 'center', maxWidth: '800px', margin: '0 auto 3.5rem auto' }}>
              <span className="mono-tag">FERRAMENTA INTERATIVA DE ESTIMATIVA</span>

            <div style={{ background: 'var(--color-offwhite-card)', border: '1px solid var(--color-border-light)', borderRadius: '28px', padding: '1.5rem' }}>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '2rem' }}>
                <div>
                  <label style={{ fontFamily: 'var(--font-mono)', fontSize: '0.75rem', fontWeight: 700, display: 'block', marginBottom: '1rem' }}>1. QUAL É O SEU GASTO MENSAL COM ENERGIA?</label>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', background: '#FFFFFF', border: '1px solid var(--color-border-light)', borderRadius: '16px', padding: '0.75rem 1rem', marginBottom: '1rem' }}>
                    <span style={{ fontFamily: 'var(--font-mono)', fontSize: '1.3rem', fontWeight: 700, color: 'var(--color-tech-green)' }}>R$</span>
                    <input type="number" min="100" max="10000" step="50" value={monthlySpend} onChange={(e) => setMonthlySpend(Number(e.target.value))} style={{ fontFamily: 'var(--font-display)', fontSize: '1.75rem', fontWeight: 800, border: 'none', outline: 'none', background: 'transparent', width: '100%' }} />
                  </div>
                  <input type="range" min="100" max="10000" step="50" value={monthlySpend} onChange={(e) => setMonthlySpend(Number(e.target.value))} />

                  <label style={{ fontFamily: 'var(--font-mono)', fontSize: '0.75rem', fontWeight: 700, display: 'block', marginTop: '2rem', marginBottom: '1rem' }}>2. QUAL É O TIPO DO IMÓVEL?</label>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(90px, 1fr))', gap: '0.75rem' }}>
                    {['RESIDENCIAL', 'COMERCIAL', 'RURAL'].map((type) => (
                      <button key={type} type="button" onClick={() => setPropertyType(type)} style={{ background: propertyType === type ? 'var(--color-dark-bg)' : '#FFFFFF', color: propertyType === type ? 'var(--color-offwhite)' : 'var(--color-black-text)', border: '1px solid var(--color-border-light)', borderRadius: '14px', padding: '0.85rem 0.4rem', cursor: 'pointer', fontFamily: 'var(--font-mono)', fontSize: '0.65rem', fontWeight: 700 }}>
                        {type}
                      </button>
                    ))}
                  </div>
                </div>

                <div style={{ background: 'var(--color-dark-bg)', color: 'var(--color-offwhite)', borderRadius: '20px', padding: '1.5rem', display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
                  <div>
                    <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.7rem', color: 'var(--accent-color)' }}>● SIMULAÇÃO INSTANTÂNEA</span>
                    <div style={{ margin: '1.25rem 0' }}>
                      <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.65rem', color: 'var(--color-grey-muted)' }}>ECONOMIA ESTIMADA</span>
                      <h3 style={{ fontFamily: 'var(--font-mono)', fontSize: '1.6rem', color: '#00E676' }}>R$ {estimatedMonthlySavings.toLocaleString('pt-BR')} / mês</h3>
                    </div>
                    <div style={{ margin: '1.25rem 0' }}>
                      <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.65rem', color: 'var(--color-grey-muted)' }}>POTENCIAL ANUAL</span>
                      <h3 style={{ fontFamily: 'var(--font-mono)', fontSize: '1.6rem', color: 'var(--accent-color)' }}>R$ {estimatedAnnualSavings.toLocaleString('pt-BR')} / ano</h3>
                    </div>
